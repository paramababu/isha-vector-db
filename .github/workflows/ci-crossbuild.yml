name: ci-crossbuild

# Every platform we claim to support must at least compile on every pull request.
# A platform that is not in CI is officially unsupported (docs/architecture/11 §11.2, R1).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-unknown-linux-gnu
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The engine crates must build for every target. Backends that are inherently
      # platform-specific are excluded per target as they are added.
      - run: cargo build -p isha-vector-db-core -p isha-vector-db-format -p isha-vector-db-index-flat -p isha-vector-db-storage-memory --target ${{ matrix.target }}
      # The OS backend is for real filesystems, so it is built everywhere except wasm.
      - if: matrix.target != 'wasm32-unknown-unknown'
        run: cargo build -p isha-vector-db-storage-os --target ${{ matrix.target }}

  apple:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The Node addon and the JNI shim are host bindings: napi links against the Node runtime
      # and jni against a JVM, and neither exists on a phone. Building them for iOS fails at the
      # link step with undefined `_napi_*` symbols, which is what this job hit the first time it
      # ran. What the job is actually for is proving the *engine* cross-compiles.
      - run: |
          cargo build --workspace --target ${{ matrix.target }} \
            --exclude isha-vector-db-node \
            --exclude isha-vector-db-jni
