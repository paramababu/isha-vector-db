name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Builds the module and runs the SDK tests: the whole web stack, from JavaScript through
      # the C ABI to the engine and back. What it cannot cover is real OPFS, which needs a
      # browser; sdk/web/test/browser.html exists for that.
      - name: Build and test
        run: ./scripts/build-web.sh

      # The committed module must work, which is a different question from whether it is
      # byte-identical to a fresh build. It is not, and cannot be: CI builds on Linux with a
      # different rustc patch release and different embedded paths from whoever last committed
      # it, so requiring identical bytes would fail on every run and teach everyone to ignore
      # this job.
      #
      # What matters is that the artefact people install actually runs, and that it is not so old
      # that it predates a change to the engine. Both are checkable.
      - name: The committed module runs
        run: |
          git checkout -- sdk/web/vdb.wasm
          cd sdk/web && node --test test/wasm.test.js test/opfs.test.js

      - name: The committed module is not stale
        run: |
          committed=$(cd sdk/web && node -e "
            const fs = require('node:fs');
            const { load } = require('./src/vdb.js');
            const { nodeAdapter } = require('./src/adapters/node.js');
            load(fs.readFileSync('vdb.wasm'), nodeAdapter(fs.mkdtempSync('/tmp/v')))
              .then((v) => console.log(v.version + ' ' + v.formatVersion));
          ")
          source_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "committed module: $committed"
          echo "source version:   $source_version"
          case "$committed" in
            "$source_version "*) ;;
            *)
              echo
              echo "The committed sdk/web/vdb.wasm was built from a different release."
              echo "Run ./scripts/build-web.sh and commit the result."
              exit 1
              ;;
          esac
