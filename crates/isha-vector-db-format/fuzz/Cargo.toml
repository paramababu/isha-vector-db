[package]
name = "isha-vector-db-format-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Excluded from the parent workspace on purpose. cargo-fuzz builds with its own profile and
# sanitiser flags, and a member of the workspace would inherit the workspace's profile instead.
# Without this, every cargo command on the fuzz manifest fails with "current package believes
# it's in a workspace when it's not" — which is what the fuzz-build job hit the first time CI
# ever ran it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
isha-vector-db-format = { path = ".." }

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false

[[bin]]
name = "value"
path = "fuzz_targets/value.rs"
test = false
doc = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false

[[bin]]
name = "catalog"
path = "fuzz_targets/catalog.rs"
test = false
doc = false

[[bin]]
name = "wal"
path = "fuzz_targets/wal.rs"
test = false
doc = false

[[bin]]
name = "segment"
path = "fuzz_targets/segment.rs"
test = false
doc = false
