[package]
name = "vdb-format"
description = "The vdb on-disk format: byte layouts, encoders, decoders and version handling. Depends on nothing, so migration tooling can read old databases without linking the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Intentionally empty, and enforced by scripts/check-core-purity.sh.
# See docs/adr/README.md ADR-0004: a dependency's encoding change would silently break every
# database already on disk, so this crate owns its bytes outright.

[lints]
workspace = true
