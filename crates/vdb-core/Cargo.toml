[package]
name = "vdb-core"
description = "Core engine for an embedded, offline-first vector database. Platform-independent: performs no I/O of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Workspace crates only. Third-party dependencies require an ADR and are rejected by
# .github/workflows/ci-core-purity.yml. See docs/adr/README.md ADR-0004.
vdb-format.workspace = true

[dev-dependencies]
# A dev-dependency cycle back onto this crate, which cargo permits. The alternative — putting
# the engine's own recovery tests in the testkit — would put them further from the code they
# guard.
vdb-testkit.workspace = true
vdb-storage-memory.workspace = true
# Only for tests/compat.rs, which must open a real on-disk database written by an older release.
# A dev-dependency, so the purity rule that keeps this crate free of platform code still holds.
vdb-storage-os.workspace = true

[lints]
workspace = true
