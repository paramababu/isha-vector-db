# Android cross-compilation.
#
# The NDK's clang wrappers rather than cargo-ndk: one fewer tool to install, and the linker path
# is the only thing cargo-ndk was providing. `scripts/build-android.sh` fills these in from
# ANDROID_NDK_HOME so the paths are not hard-coded to one machine.
[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang"
