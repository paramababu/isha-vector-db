[workspace]
resolver = "2"
members = [
    "crates/isha-vector-db-bench",
    "crates/isha-vector-db-cli",
    "crates/isha-vector-db-core",
    "crates/isha-vector-db-ffi",
    "crates/isha-vector-db-format",
    "crates/isha-vector-db-index-flat",
  "crates/isha-vector-db-index-hnsw",
    "crates/isha-vector-db-jni",
    "crates/isha-vector-db-node",
    "crates/isha-vector-db-storage-memory",
    "crates/isha-vector-db-storage-os",
  "crates/isha-vector-db-storage-web",
    "crates/isha-vector-db-testkit",
]

exclude = ["crates/isha-vector-db-format/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
repository = "https://github.com/OWNER/vdb"
authors = ["vdb contributors"]

[workspace.dependencies]
isha-vector-db-core = { path = "crates/isha-vector-db-core", version = "0.1.0" }
isha-vector-db-format = { path = "crates/isha-vector-db-format", version = "0.1.0" }
isha-vector-db-index-flat = { path = "crates/isha-vector-db-index-flat", version = "0.1.0" }
isha-vector-db-index-hnsw = { path = "crates/isha-vector-db-index-hnsw", version = "0.1.0" }
isha-vector-db-storage-memory = { path = "crates/isha-vector-db-storage-memory", version = "0.1.0" }
isha-vector-db-storage-os = { path = "crates/isha-vector-db-storage-os", version = "0.1.0" }
isha-vector-db-storage-web = { path = "crates/isha-vector-db-storage-web", version = "0.1.0" }
isha-vector-db-testkit = { path = "crates/isha-vector-db-testkit", version = "0.1.0" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
# Documentation that points at an item which no longer exists is the same rot as a dead file
# path, and `scripts/check-references.sh` deliberately does not police intra-doc links because
# rustdoc already can.
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# The rules from docs/architecture/02-technology.md §2.4, mechanically enforced.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Mobile: size over speed. Used by scripts/build-native.sh.
[profile.mobile]
inherits = "release"
opt-level = "z"

[profile.bench]
inherits = "release"
debug = true
